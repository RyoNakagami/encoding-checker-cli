name: Post Pull Request Processing

on:
  pull_request:
    branches:
      - main
    types:
      - closed  # PR closure event

permissions:
  contents: write

jobs:
  post_merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -------------------------------
      # Step 1: Create Python setup
      # -------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      # -------------------------------
      # Step 2: Create Git tag from pyproject.toml
      # -------------------------------
      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Tag main branch
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # -------------------------------
      # Step 3: Merge main changes into release/1.1.x
      # -------------------------------
      - name: Extract major.minor version
        id: extract_version
        run: |
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          echo "MAJOR_MINOR=$MAJOR_MINOR" >> $GITHUB_OUTPUT

      - name: Merge main into release branch
        run: |
          RELEASE_BRANCH="release/${{ steps.extract_version.outputs.MAJOR_MINOR }}.x"  # e.g., 1.1.x
          git fetch origin
          if git show-ref --verify --quiet "refs/heads/$RELEASE_BRANCH"; then
            git switch "$RELEASE_BRANCH"
            git merge --no-ff main -m "Merge main after beta-release-$VERSION"
            git push origin "$RELEASE_BRANCH"
          else
            echo "Release branch $RELEASE_BRANCH does not exist."
            git switch -c "$RELEASE_BRANCH"
            git push origin "$RELEASE_BRANCH"
          fi

      # -------------------------------
      # Step 4: Merge main into develop
      # -------------------------------
      - name: Merge main into develop
        run: |
          git switch develop
          git merge --no-ff main -m "Merge main after beta-release-$VERSION"
          git push origin develop
